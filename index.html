<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SEKAI NO OWARI風リリックメーカー</title>
<style>
:root{
  --bg:#090a10; --panel:#111522; --panel2:#171c2c; --line:#2b3247;
  --text:#f6f7fb; --muted:#a8b0c2; --accent:#9fb3ff; --accent2:#d998ff;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
  background:
    radial-gradient(circle at 12% 5%,rgba(159,179,255,.12),transparent 28%),
    radial-gradient(circle at 88% 12%,rgba(217,152,255,.10),transparent 25%),
    linear-gradient(180deg,#08090e,#0b0e17 60%,#08090e);
}
.wrap{max-width:960px;margin:auto;padding:32px 18px 60px}
.badge{display:inline-block;font-size:12px;color:#d9def0;border:1px solid var(--line);background:rgba(255,255,255,.03);padding:6px 10px;border-radius:999px;margin-bottom:14px}
h1{font-size:clamp(30px,5vw,54px);line-height:1.05;margin:0 0 10px;letter-spacing:.03em}
.lead{color:var(--muted);line-height:1.7;margin:0 0 24px}
.card{background:rgba(17,21,34,.94);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 18px 60px rgba(0,0,0,.28)}
.section-title{font-size:13px;color:#c9d0e2;letter-spacing:.08em;margin:2px 0 10px}
.theme-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.theme-btn,.level-btn{
  border:1px solid var(--line);background:var(--panel2);color:var(--text);
  border-radius:12px;padding:12px 8px;cursor:pointer;font-weight:700;transition:.18s;
}
.theme-btn:hover,.level-btn:hover{transform:translateY(-1px);border-color:#475470}
.theme-btn.active,.level-btn.active{
  background:linear-gradient(135deg,rgba(159,179,255,.22),rgba(217,152,255,.22));
  border-color:#7487c7;
}
.settings{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}
.setting{background:#0e1320;border:1px solid var(--line);border-radius:14px;padding:14px}
.setting-name{font-weight:800;margin-bottom:4px}
.setting-desc{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:10px}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.level-btn{padding:9px 8px;font-size:14px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.action{border:0;border-radius:12px;padding:13px 18px;font-weight:800;font-size:15px;cursor:pointer}
.generate{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#080a10}
.generate:disabled{opacity:.38;cursor:not-allowed}
.secondary{background:#1a2031;color:#eef1ff;border:1px solid #303a55}
.hint{margin-top:10px;font-size:12px;color:#818ba1}
.result{display:none;margin-top:18px}
.song-title{font-size:clamp(25px,4vw,40px);font-weight:900;margin-bottom:8px}
.meta{font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:16px}
.lyrics{white-space:pre-wrap;line-height:1.95;font-size:17px;background:#0c111d;border:1px solid var(--line);border-radius:16px;padding:20px}
.disclaimer{margin-top:16px;color:#858fa6;font-size:12px;line-height:1.7}
@media(max-width:760px){
  .theme-grid{grid-template-columns:repeat(2,1fr)}
  .theme-btn:last-child{grid-column:1/-1}
  .settings{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="badge">非公式ファンメイド / ジョーク用 / 既存歌詞不使用</div>
  <h1>SEKAI NO OWARI風リリックメーカー</h1>
  <p class="lead">テーマと4つの「度」を自分で設定してから、生成ボタンを押してください。</p>

  <div class="card">
    <div class="section-title">MAIN THEME</div>
    <div class="theme-grid">
      <button class="theme-btn" data-theme="fantasy">ファンタジー</button>
      <button class="theme-btn" data-theme="philosophy">哲学</button>
      <button class="theme-btn" data-theme="dark">ダーク</button>
      <button class="theme-btn" data-theme="love">恋愛</button>
      <button class="theme-btn" data-theme="society">社会</button>
    </div>

    <div class="settings">
      <div class="setting" data-setting="metaphor">
        <div class="setting-name">比喩度</div>
        <div class="setting-desc">1＝直接的　2＝ほどほど　3＝象徴表現多め</div>
        <div class="levels">
          <button class="level-btn" data-value="1">1</button>
          <button class="level-btn" data-value="2">2</button>
          <button class="level-btn" data-value="3">3</button>
        </div>
      </div>

      <div class="setting" data-setting="twist">
        <div class="setting-name">どんでん返し度</div>
        <div class="setting-desc">1＝なし　2＝少し変化　3＝最後で反転</div>
        <div class="levels">
          <button class="level-btn" data-value="1">1</button>
          <button class="level-btn" data-value="2">2</button>
          <button class="level-btn" data-value="3">3</button>
        </div>
      </div>

      <div class="setting" data-setting="story">
        <div class="setting-name">ストーリー度</div>
        <div class="setting-desc">1＝心情中心　2＝出来事あり　3＝短編物語型</div>
        <div class="levels">
          <button class="level-btn" data-value="1">1</button>
          <button class="level-btn" data-value="2">2</button>
          <button class="level-btn" data-value="3">3</button>
        </div>
      </div>

      <div class="setting" data-setting="message">
        <div class="setting-name">メッセージ度</div>
        <div class="setting-desc">1＝余韻重視　2＝読み解ける　3＝主題が明確</div>
        <div class="levels">
          <button class="level-btn" data-value="1">1</button>
          <button class="level-btn" data-value="2">2</button>
          <button class="level-btn" data-value="3">3</button>
        </div>
      </div>
    </div>

    <div class="actions">
      <button class="action generate" id="generateBtn" disabled>生成</button>
      <button class="action secondary" id="resetBtn">設定をリセット</button>
    </div>
    <div class="hint" id="hint">メインテーマと4項目をすべて選ぶと生成できます。</div>
  </div>

  <div class="card result" id="result">
    <div class="song-title" id="songTitle"></div>
    <div class="meta" id="meta"></div>
    <div class="lyrics" id="lyrics"></div>
    <div class="actions">
      <button class="action secondary" id="copyBtn">歌詞をコピー</button>
      <button class="action secondary" id="regenBtn">同じ設定でもう一曲</button>
    </div>
    <div class="disclaimer">
      ※このページは非公式のファン向けジョークです。既存楽曲の歌詞は収録・引用していません。
    </div>
  </div>
</div>

<script>

    places:["同じ制服が並ぶ教室","巨大なスクリーンのある街","拍手だけが響く広場","正解だけを教える学校"],
    beings:["ルールを守る少年","拍手する群衆","質問をやめた先生","番号で呼ばれる僕"],
    objects:["赤いスタンプ","白いマスク","採点済みの答案","壊れた拡声器"],
    conflicts:["正しい答えを言うほど誰かが黙った","みんなと同じでいるために嘘をついた","拍手をやめる理由だけ見つからなかった"],

    titles:["教室","群衆","規則","正義","多数派","制服","境界","社会","自由","沈黙","学校","会社","国家","法律","制度","常識","世間","権力","秩序","管理","監視","評価","点数","偏差値","順位","競争","格差","貧困","富","労働","仕事","休日","残業","給料","税金","選挙","政治","議会","裁判","警察","報道","新聞","広告","テレビ","ネット","SNS","炎上","匿名","世論","流行","多数決","少数派","同調","圧力","空気","建前","本音","偏見","差別","分断","対立","戦争","平和","国境","民族","宗教","思想","教育","歴史","文化","ルール","マナー","優等生","落伍者","成功","失敗","勝者","敗者","犠牲","責任","義務","権利","平等","公平","公正","正解","不正解","採点","答案","教科書","校則","マニュアル","契約","署名","判決","命令","許可","禁止","番号","名札","標準","例外","効率","成果","数字","統計"]

const metaphors = {
  1:["僕はまだ答えを知らない。","君の声だけが残っていた。","誰にも言えないまま朝になった。"],
  2:["夜は黒いカーテンみたいに街を隠した。","僕らは壊れた地図を持ったまま歩いた。","沈黙が部屋の中で少しずつ大きくなった。"],
  3:["月は錆びたコインみたいに空の底で光っていた。","僕の心臓は誰にも届かない非常ベルみたいに鳴っていた。","君の沈黙は鍵のない檻みたいに僕を閉じ込めた。"]
};


const openings2 = [
  (p,b,o,c)=>`${p}で、${b}が僕の名前を呼んだ。\nその手には${o}があった。\n${c}。\n${R(metaphors[state.metaphor])}`,
  (p,b,o,c)=>`${p}の隅で、${b}が僕を待っていた。\n足元には${o}が落ちていた。\n${c}。\n${R(metaphors[state.metaphor])}`,
  (p,b,o,c)=>`${p}を歩いていると、${b}が僕の前を横切った。\nなぜか${o}だけを置いていった。\n${c}。\n${R(metaphors[state.metaphor])}`,
  (p,b,o,c)=>`${p}で、僕は${b}の後ろ姿を見つけた。\n追いついたとき、${o}を差し出された。\n${c}。\n${R(metaphors[state.metaphor])}`,
  (p,b,o,c)=>`${p}に着くと、${b}が一人で座っていた。\n隣には${o}が置かれていた。\n${c}。\n${R(metaphors[state.metaphor])}`,

  (p,b,o,c)=>`${p}の出口で、${b}とぶつかった。\n床に転がった${o}を二人で同時に拾った。\n${c}。\n${R(metaphors[state.metaphor])}`,

];

const openings3 = [
  (p,b,o,c)=>`${p}で、僕宛ての${o}が見つかった。\n差出人の名前はなかった。\nそれを拾った瞬間、${b}が「やっと来た」と言った。\n僕は何も知らないまま後をついていった。\n途中で${c}。`,

  (p,b,o,c)=>`${p}で、${o}を盗んだ犯人を探していた。\n最初に疑ったのは${b}だった。\nでも${b}は「盗まれたのは君の方だ」と笑った。\n意味が分からないまま、僕らは街を歩き始めた。\n途中で${c}。`,
  (p,b,o,c)=>`${p}に、昨日はなかった扉が現れた。\n扉の前には${b}と${o}があった。\n「開けるなら一緒に来て」\nそう言われて、僕は取っ手に手をかけた。\nその先で${c}。`,
  (p,b,o,c)=>`${p}で、僕は${b}に追いかけられていた。\n理由は分からない。\n逃げ込んだ路地の奥で${o}を拾うと、追ってきた足音が止まった。\nそこで初めて${b}が口を開いた。\n${c}。`,
  (p,b,o,c)=>`${p}の時計が同時に止まった夜、${b}だけが動いていた。\n${b}は僕に${o}を渡し、「これを元の場所へ戻して」と言った。\n元の場所がどこなのかも知らないまま、僕らは歩き始めた。\n途中で${c}。`,
  (p,b,o,c)=>`${p}で、${b}が倒れていた。\nその手には${o}が握られていた。\n目を覚ました${b}は僕を見るなり、「君が最後なんだ」と言った。\n何が最後なのか聞けないまま、僕らは走り出した。\n途中で${c}。`,
  (p,b,o,c)=>`${p}で、知らない番号から電話がかかってきた。\n受話器の向こうにいたのは${b}だった。\n「足元を見て」\nそこには${o}が置かれていた。\nその瞬間から${c}。`,
  (p,b,o,c)=>`${p}で、僕は自分と同じ名前を呼ばれた。\n振り向くと${b}がいて、${o}を持っていた。\n「これは君が昨日なくしたものだ」\nでも僕には、そんな記憶がなかった。\n歩き出したあとで${c}。`,
  (p,b,o,c)=>`${p}の終点で電車を降りると、乗客は僕と${b}だけだった。\n座席には${o}が残されていた。\n${b}はそれを見るなり顔色を変えた。\n僕らは駅を出て、持ち主を探すことにした。\nその夜、${c}。`,
  (p,b,o,c)=>`${p}で開催されるはずのないパレードが始まった。\n最後尾を歩いていた${b}が僕に${o}を投げてよこした。\n「これを持っている間だけ、君は見つからない」\n何から隠れるのか分からないまま、僕は走った。\nその途中で${c}。`,
  (p,b,o,c)=>`${p}で、壁に僕の名前が書かれていた。\nその下には${o}が吊るされていた。\n消そうとした瞬間、背後から${b}が「触らない方がいい」と言った。\n僕らはその理由を確かめるために歩き始めた。\n途中で${c}。`,
  (p,b,o,c)=>`${p}の片隅で、${b}が地図を燃やしていた。\n炎の中から残ったのは${o}だけだった。\n「行き先が分かると、たどり着けないこともある」\nそう言って${b}は歩き出した。\n僕も後を追い、やがて${c}。`,
  (p,b,o,c)=>`${p}で、僕は${o}をなくした。\n探していると、同じものを持った${b}が現れた。\n「これは君のじゃない」と言われたのに、なぜか見覚えがあった。\n僕らは本当の持ち主を探すことにした。\n途中で${c}。`,
  (p,b,o,c)=>`${p}で、知らない子どもから${o}を預かった。\n「${b}に渡して」とだけ言い残して、その子は消えた。\n${b}を探して歩くうちに、街の様子が少しずつ変わっていった。\nそして${c}。`,
  (p,b,o,c)=>`${p}に一晩だけ現れる店があった。\n店番は${b}で、棚には${o}が一つだけ置かれていた。\n代金を聞くと「君の忘れたい記憶」と言われた。\n僕は答えを出せないまま店を出た。\nその帰り道で${c}。`
];

const endings = {
  1:["朝になっても答えは出なかった。でも昨日より少しだけ怖くなかった。","最後まで分からなかった。ただ君が笑った理由だけは覚えている。"],
  2:["そこで初めて気づいた。僕が探していた答えは、ずっと君の質問の中にあった。","最後のページには何も書かれていなかった。だから僕は自分の言葉で続きを書いた。"],
  3:["最後に鏡を見て気づいた。ずっと追いかけていた怪物は、最初から僕だった。","君に向けて書いたはずの手紙には、僕自身の名前しかなかった。","夜が終わらないんじゃなかった。僕が朝を怖がってカーテンを閉めていただけだった。"]
};

function updateButton(){
  const ready = Object.values(state).every(v => v !== null);
  const btn = document.getElementById("generateBtn");
  btn.disabled = !ready;
  document.getElementById("hint").textContent = ready
    ? "設定完了。生成できます。"
    : "メインテーマと4項目をすべて選ぶと生成できます。";
}

document.querySelectorAll(".theme-btn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".theme-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    state.theme = btn.dataset.theme;
    updateButton();
  });
});

document.querySelectorAll(".setting").forEach(box=>{
  box.querySelectorAll(".level-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{
      box.querySelectorAll(".level-btn").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      state[box.dataset.setting] = Number(btn.dataset.value);
      updateButton();
    });
  });
});

function generateLyrics(){
  if(Object.values(state).some(v=>v===null)) return;
  const b = banks[state.theme];
  const place = R(b.places), being=R(b.beings), obj=R(b.objects), conflict=R(b.conflicts);
  const title = R(b.titles);

  let verse1, verse2;
  if(state.story===1){
    const quietOpenings = [
      `${R(metaphors[state.metaphor])}\n${place}で僕は一人で立っていた。\n${conflict}。`,
      `${place}を歩きながら、僕は何度も同じことを考えていた。\n${R(metaphors[state.metaphor])}\n${conflict}。`,
      `${obj}をポケットに入れたまま、${place}を歩いた。\n誰にも話さなかったけれど、${conflict}。\n${R(metaphors[state.metaphor])}`,
      `${place}には僕しかいなかった。\nそれなのに、誰かに見られている気がした。\n${R(metaphors[state.metaphor])}\n${conflict}。`,
      `${place}で立ち止まるたび、昨日のことを思い出した。\n${conflict}。\n${R(metaphors[state.metaphor])}`,
      `${obj}を見ると、なぜか君のことを思い出す。\n${place}はいつもより広く見えた。\n${R(metaphors[state.metaphor])}\n${conflict}。`
    ];
    verse1 = R(quietOpenings);
    verse2 = R([
      `${R(metaphors[state.metaphor])}\n思い出すたびに昨日と今日の境目が曖昧になった。`,
      `言葉にしようとすると、どれも少し違って聞こえた。\n${R(metaphors[state.metaphor])}\nだから僕は黙っていた。`,
      `${place}の景色は何も変わっていない。\n変わったのは僕の方なのかもしれない。\n${R(metaphors[state.metaphor])}`,
      `${obj}を見つめているうちに、何を忘れたかったのかまで分からなくなった。\n${R(metaphors[state.metaphor])}`
    ]);
  } else if(state.story===2){
    verse1 = R(openings2)(place,being,obj,conflict);
    verse2 = R([
      `道の途中で、もう一つの${obj}を見つけた。\n${being}は拾わずに通り過ぎた。\n${R(metaphors[state.metaphor])}`,
      `しばらく歩いてから、${being}が突然立ち止まった。\n「ここ、前にも来たことがある」\nでも僕には初めての場所だった。`,
      `${place}を離れても、${obj}のことが頭から離れなかった。\n${being}は何も説明しなかった。\n${R(metaphors[state.metaphor])}`,
      `途中で僕らは別々の道を選んだ。\nなのに次の角で、また${being}が立っていた。\n${R(metaphors[state.metaphor])}`,
      `${being}は歩きながら、昔の話を一つだけした。\nその話にはなぜか${obj}が出てきた。\n僕は偶然だと思うことにした。`,
      `空が暗くなるころ、${obj}が一度だけ音を立てた。\n${being}は「急ごう」とだけ言った。\n${R(metaphors[state.metaphor])}`
    ]);
  } else {
    verse1 = R(openings3)(place,being,obj,conflict);
    verse2 = R([
      `二つ目の角を曲がると、同じ${obj}が道の真ん中に置かれていた。\n${being}は足を止めた。僕だけが、その意味を知らなかった。\n遠くで鐘が鳴って、街の明かりが一つずつ消えた。`,
      `目的地へ向かう途中、地図から道が一本消えた。\n${being}は驚かなかった。\n「次は名前が消える」と言って、${obj}を強く握った。`,
      `橋を渡ったところで、僕らの影が三つに増えた。\n${being}は振り返らずに歩き続けた。\n${obj}だけが冷たくなっていった。`,
      `真夜中になると、${place}の景色が少しだけ変わった。\n看板から文字が消え、人の声も聞こえなくなった。\nそれでも${being}は先へ進んだ。`,
      `僕らは途中で一枚の写真を拾った。\nそこには僕と${being}が写っていた。\n撮られた覚えはない。\n裏には${obj}と同じ名前が書かれていた。`,
      `歩き続けるうちに、${being}の話が少しずつ矛盾し始めた。\n昨日と言っていたことが百年前の出来事になり、${obj}の持ち主も何度も変わった。\nそれでも僕はついていった。`
    ]);
  }

  let chorus;
  if(state.message===1){
    chorus = `ねえ、もし明日になって\n今日のことを忘れてしまっても、\nこの夜に名前をつけないで。\n名前のないものだけが残ることもあるから。`;
  } else if(state.message===2){
    chorus = `正しいことを選んだはずなのに、\nどうして君は泣いているんだろう。\n${R(b.messages)}。\n僕はまだ、それを信じる練習をしている。`;
  } else {
    chorus = `${R(b.messages)}。\nだから僕は、誰かが決めた正解より、\n自分で考えて選んだ間違いを引き受けたい。\nそれが僕の今日を生きるということだ。`;
  }

  const questions = [
    "幸せは、失くしてから数えるものなんだろうか。",
    "正しさは、誰かを傷つけても正しいままなんだろうか。",
    "自由は、選べることなのか、選ばないことなのか。",
    "忘れることと、許すことは同じなんだろうか。"
  ];

  let bridge = (state.theme==="philosophy" || state.message>=2 ? R(questions)+"\n" : "");
  bridge += state.story===3 ? "僕らは結局、目的地の手前で立ち止まった。" : "答えは出ないまま、空だけが少し明るくなった。";

  const lyrics = `[Verse 1]
${verse1}

[Verse 2]
${verse2}

[Chorus]
${chorus}

[Bridge]
${bridge}

[Last]
${R(endings[state.twist])}`;

  document.getElementById("songTitle").textContent = title;
  document.getElementById("meta").textContent =
    `テーマ：${b.label} ／ 比喩度：${state.metaphor} ／ どんでん返し度：${state.twist} ／ ストーリー度：${state.story} ／ メッセージ度：${state.message}`;
  document.getElementById("lyrics").textContent = lyrics;
  document.getElementById("result").style.display = "block";
  document.getElementById("result").scrollIntoView({behavior:"smooth",block:"start"});
}

document.getElementById("generateBtn").addEventListener("click",generateLyrics);
document.getElementById("regenBtn").addEventListener("click",generateLyrics);

document.getElementById("copyBtn").addEventListener("click",async()=>{
  const t=document.getElementById("songTitle").textContent;
  const l=document.getElementById("lyrics").textContent;
  if(!l) return;
  await navigator.clipboard.writeText(`${t}\n\n${l}`);
});

document.getElementById("resetBtn").addEventListener("click",()=>{
  state.theme=state.metaphor=state.twist=state.story=state.message=null;
  document.querySelectorAll(".active").forEach(el=>el.classList.remove("active"));
  document.getElementById("result").style.display="none";
  updateButton();
});

updateButton();
</script>
</body>
</html>
