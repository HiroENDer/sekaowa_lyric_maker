<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SEKAI NO OWARI風リリックメーカー</title>
<style>
:root{
  --bg:#090a10; --panel:#111522; --panel2:#171c2c; --line:#2b3247;
  --text:#f6f7fb; --muted:#a8b0c2; --accent:#9fb3ff; --accent2:#d998ff;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
  background:
    radial-gradient(circle at 12% 5%,rgba(159,179,255,.12),transparent 28%),
    radial-gradient(circle at 88% 12%,rgba(217,152,255,.10),transparent 25%),
    linear-gradient(180deg,#08090e,#0b0e17 60%,#08090e);
}
.wrap{max-width:960px;margin:auto;padding:32px 18px 60px}
.badge{display:inline-block;font-size:12px;color:#d9def0;border:1px solid var(--line);background:rgba(255,255,255,.03);padding:6px 10px;border-radius:999px;margin-bottom:14px}
h1{font-size:clamp(30px,5vw,54px);line-height:1.05;margin:0 0 10px;letter-spacing:.03em}
.lead{color:var(--muted);line-height:1.7;margin:0 0 24px}
.card{background:rgba(17,21,34,.94);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 18px 60px rgba(0,0,0,.28)}
.section-title{font-size:13px;color:#c9d0e2;letter-spacing:.08em;margin:2px 0 10px}
.theme-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.theme-btn,.level-btn{
  border:1px solid var(--line);background:var(--panel2);color:var(--text);
  border-radius:12px;padding:12px 8px;cursor:pointer;font-weight:700;transition:.18s;
}
.theme-btn:hover,.level-btn:hover{transform:translateY(-1px);border-color:#475470}
.theme-btn.active,.level-btn.active{
  background:linear-gradient(135deg,rgba(159,179,255,.22),rgba(217,152,255,.22));
  border-color:#7487c7;
}
.settings{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}
.setting{background:#0e1320;border:1px solid var(--line);border-radius:14px;padding:14px}
.setting-name{font-weight:800;margin-bottom:4px}
.setting-desc{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:10px}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.level-btn{padding:9px 8px;font-size:14px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.action{border:0;border-radius:12px;padding:13px 18px;font-weight:800;font-size:15px;cursor:pointer}
.generate{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#080a10}
.generate:disabled{opacity:.38;cursor:not-allowed}
.secondary{background:#1a2031;color:#eef1ff;border:1px solid #303a55}
.hint{margin-top:10px;font-size:12px;color:#818ba1}
.result{display:none;margin-top:18px}
.song-title{font-size:clamp(25px,4vw,40px);font-weight:900;margin-bottom:8px}
.meta{font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:16px}
.lyrics{white-space:pre-wrap;line-height:1.95;font-size:17px;background:#0c111d;border:1px solid var(--line);border-radius:16px;padding:20px}
.disclaimer{margin-top:16px;color:#858fa6;font-size:12px;line-height:1.7}
@media(max-width:760px){
  .theme-grid{grid-template-columns:repeat(2,1fr)}
  .theme-btn:last-child{grid-column:1/-1}
  .settings{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="badge">非公式ファンメイド / ジョーク用 / 既存歌詞不使用</div>
  <h1>SEKAI NO OWARI風リリックメーカー</h1>
  <p class="lead">テーマと4つの「度」を自分で設定してから、生成ボタンを押してください。</p>

  <div class="card">
    <div class="section-title">MAIN THEME</div>
    <div class="theme-grid">
      <button class="theme-btn" data-theme="fantasy">ファンタジー</button>
      <button class="theme-btn" data-theme="philosophy">哲学</button>
      <button class="theme-btn" data-theme="dark">ダーク</button>
      <button class="theme-btn" data-theme="love">恋愛</button>
      <button class="theme-btn" data-theme="society">社会</button>
    </div>

    <div class="settings">
      <div class="setting" data-setting="metaphor">
        <div class="setting-name">比喩度</div>
        <div class="setting-desc">1＝直接的　2＝ほどほど　3＝象徴表現多め</div>
        <div class="levels">
          <button class="level-btn" data-value="1">1</button>
          <button class="level-btn" data-value="2">2</button>
          <button class="level-btn" data-value="3">3</button>
        </div>
      </div>

      <div class="setting" data-setting="twist">
        <div class="setting-name">どんでん返し度</div>
        <div class="setting-desc">1＝なし　2＝少し変化　3＝最後で反転</div>
        <div class="levels">
          <button class="level-btn" data-value="1">1</button>
          <button class="level-btn" data-value="2">2</button>
          <button class="level-btn" data-value="3">3</button>
        </div>
      </div>

      <div class="setting" data-setting="story">
        <div class="setting-name">ストーリー度</div>
        <div class="setting-desc">1＝心情中心　2＝出来事あり　3＝短編物語型</div>
        <div class="levels">
          <button class="level-btn" data-value="1">1</button>
          <button class="level-btn" data-value="2">2</button>
          <button class="level-btn" data-value="3">3</button>
        </div>
      </div>

      <div class="setting" data-setting="message">
        <div class="setting-name">メッセージ度</div>
        <div class="setting-desc">1＝余韻重視　2＝読み解ける　3＝主題が明確</div>
        <div class="levels">
          <button class="level-btn" data-value="1">1</button>
          <button class="level-btn" data-value="2">2</button>
          <button class="level-btn" data-value="3">3</button>
        </div>
      </div>
    </div>

    <div class="actions">
      <button class="action generate" id="generateBtn" disabled>生成</button>
      <button class="action secondary" id="resetBtn">設定をリセット</button>
    </div>
    <div class="hint" id="hint">メインテーマと4項目をすべて選ぶと生成できます。</div>
  </div>

  <div class="card result" id="result">
    <div class="song-title" id="songTitle"></div>
    <div class="meta" id="meta"></div>
    <div class="lyrics" id="lyrics"></div>
    <div class="actions">
      <button class="action secondary" id="copyBtn">歌詞をコピー</button>
      <button class="action secondary" id="regenBtn">同じ設定でもう一曲</button>
    </div>
    <div class="disclaimer">
      ※このページは非公式のファン向けジョークです。既存楽曲の歌詞は収録・引用していません。
    </div>
  </div>
</div>

  (p,b,o,c)=>`何度考えても同じところに戻ってくる。\n${R(metaphors[state.metaphor])}\n答えはまだ出なかった。`,
  (p,b,o,c)=>`遠くで誰かが笑っていた。\n僕にはその笑い声が少しだけ悲しく聞こえた。\n${R(metaphors[state.metaphor])}`,
  (p,b,o,c)=>`帰ろうと思えば帰れた。\nそれでも僕は${p}に残った。\n理由だけが最後まで見つからなかった。`,
  (p,b,o,c)=>`${o}に触れると、忘れたはずの言葉が一つだけ戻ってきた。\nでも誰が言ったのかは思い出せなかった。`
];

const story2Developments = [
  (p,b,o,c)=>`道の途中で、もう一つの${o}を見つけた。\n${b}は拾わずに通り過ぎた。\n${R(metaphors[state.metaphor])}`,
  (p,b,o,c)=>`しばらく歩いてから、${b}が突然立ち止まった。\n「ここ、前にも来たことがある」\nでも僕には初めての場所だった。`,
  (p,b,o,c)=>`${p}を離れても、${o}のことが頭から離れなかった。\n${b}は何も説明しなかった。`,
  (p,b,o,c)=>`途中で僕らは別々の道を選んだ。\nなのに次の角で、また${b}が立っていた。`,
  (p,b,o,c)=>`${b}は歩きながら、昔の話を一つだけした。\nその話にはなぜか${o}が出てきた。`,
  (p,b,o,c)=>`空が暗くなるころ、${o}が一度だけ音を立てた。\n${b}は「急ごう」とだけ言った。`,
  (p,b,o,c)=>`信号待ちの間に、${b}が「本当は帰りたくない」と言った。\n僕は理由を聞かなかった。`,
  (p,b,o,c)=>`途中の店で水を買った。\nレシートには僕らがまだ行っていない場所の名前が印字されていた。`,
  (p,b,o,c)=>`${o}の裏側に小さな文字を見つけた。\n読もうとすると、${b}が慌てて僕の手を止めた。`,
  (p,b,o,c)=>`一時間ほど歩いたはずなのに、また${p}へ戻ってきた。\n${b}だけは驚かなかった。`,
  (p,b,o,c)=>`僕らの前を子どもが走り抜けた。\nその子は${b}と同じ名前を呼ばれて振り返った。`,
  (p,b,o,c)=>`途中から雨が降り始めた。\n${b}は傘を持っていたのに開かなかった。\n${R(metaphors[state.metaphor])}`
];

const story3Developments = [
  (p,b,o,c)=>`二つ目の角を曲がると、同じ${o}が道の真ん中に置かれていた。\n${b}は足を止めた。僕だけが、その意味を知らなかった。`,
  (p,b,o,c)=>`目的地へ向かう途中、地図から道が一本消えた。\n${b}は「次は名前が消える」と言って、${o}を強く握った。`,
  (p,b,o,c)=>`橋を渡ったところで、僕らの影が三つに増えた。\n${b}は振り返らずに歩き続けた。`,
  (p,b,o,c)=>`真夜中になると、${p}の景色が少しだけ変わった。\n看板から文字が消え、人の声も聞こえなくなった。`,
  (p,b,o,c)=>`僕らは途中で一枚の写真を拾った。\nそこには僕と${b}が写っていた。\n撮られた覚えはない。`,
  (p,b,o,c)=>`歩き続けるうちに、${b}の話が少しずつ矛盾し始めた。\n昨日と言っていたことが百年前の出来事になった。`,
  (p,b,o,c)=>`突然、街中の時計が同じ時刻を示した。\n${b}は「あと一時間」と言った。\n何までの一時間かは教えてくれなかった。`,
  (p,b,o,c)=>`${o}が光り始めると、道の向こうにもう一つの${p}が現れた。\n同じ場所なのに、そこには僕らがいなかった。`,
  (p,b,o,c)=>`ある家の窓に、僕らが歩いている姿が映っていた。\nでも映像の中の僕らは、少し先の未来を歩いていた。`,
  (p,b,o,c)=>`道端の掲示板に、僕らの名前と明日の日付が書かれていた。\n${b}は紙を剥がしてポケットに入れた。`,
  (p,b,o,c)=>`僕らを追っていた足音が、いつの間にか僕らより前から聞こえてきた。\n${b}は走るのをやめた。`,
  (p,b,o,c)=>`町の出口まで来たところで、${o}が二つに割れた。\n片方には僕の名前、もう片方には${b}の名前があった。`
];

openings2.push(
  (p,b,o,c)=>`${p}で、${b}から突然「昨日の続き」を話しかけられた。\n僕には昨日会った記憶がなかった。\n${o}だけが妙に見覚えがあった。`,
  (p,b,o,c)=>`${p}で同じ${o}を持っている${b}を見つけた。\n僕らはどちらが本物か確かめることにした。`,
  (p,b,o,c)=>`${p}の掲示板に僕の名前が書かれていた。\nその前に立っていた${b}が「待ってた」と言った。`,
  (p,b,o,c)=>`${p}で、${b}が僕の落とした覚えのない${o}を返してきた。\n「次は失くさないで」と言われた。`,
  (p,b,o,c)=>`${p}で道を聞いた相手が${b}だった。\n教えられた方向へ進むと、なぜかまた同じ${b}が立っていた。`,
  (p,b,o,c)=>`${p}で${o}を拾った瞬間、遠くにいた${b}が走ってきた。\n「それを開けた？」と最初に聞かれた。`,
  (p,b,o,c)=>`${p}の自動販売機の横で${b}が泣いていた。\n僕は理由を聞かず、落ちていた${o}を拾った。`,
  (p,b,o,c)=>`${p}で${b}と同じ曲を口ずさんでいた。\n気まずく笑ったあと、${o}の話になった。`
);

openings3.push(
  (p,b,o,c)=>`${p}で、僕の名前を知っている${b}に会った。\n僕は${b}を知らなかった。\n手渡された${o}には、十年後の日付が刻まれていた。`,
  (p,b,o,c)=>`${p}のロッカーに${o}が入っていた。\n中には「${b}を探せ」とだけ書かれた紙があった。\n僕は半信半疑で歩き始めた。`,
  (p,b,o,c)=>`${p}で拾った${o}から、僕自身の声が聞こえた。\n録音された覚えはない。\nその声は${b}の名前を呼んでいた。`,
  (p,b,o,c)=>`${p}で目を覚ますと、昨日までなかった傷があった。\n隣には${b}と${o}があった。\n${b}は「また失敗したね」と言った。`,
  (p,b,o,c)=>`${p}で、${b}が僕の未来を知っていると言った。\n証拠として見せられたのが${o}だった。\nそこには僕しか知らない言葉が刻まれていた。`,
  (p,b,o,c)=>`${p}から出るためには${o}が必要だと${b}は言った。\nでもその${o}は僕の記憶の中にしか存在しなかった。`
);

const chorusPatterns = {
  1:[
    (m,p,b,o)=>`ねえ、もし明日になって\n今日のことを忘れてしまっても、\nこの夜に名前をつけないで。\n名前のないものだけが残ることもあるから。`,
    (m,p,b,o)=>`何も分からないままでいい。\n答えを急がない夜があってもいい。\n僕らはただ、同じ空を見ていた。`,
    (m,p,b,o)=>`${o}を握ったまま、僕は黙っていた。\n言葉にした瞬間、何かが壊れそうだった。\nだから今は、このままでいい。`,
    (m,p,b,o)=>`君が何を考えていたのか、最後まで分からなかった。\nそれでもあの時間が嘘だったとは思いたくない。`
  ],
  2:[
    (m,p,b,o)=>`正しいことを選んだはずなのに、\nどうして君は泣いているんだろう。\n${m}。\n僕はまだ、それを信じる練習をしている。`,
    (m,p,b,o)=>`僕らは答えを探して歩いた。\nでも見つかったのは新しい問いばかりだった。\n${m}。`,
    (m,p,b,o)=>`誰かの正解を借りるより、\n間違っても自分で選びたかった。\n${m}。`,
    (m,p,b,o)=>`${p}の夜は何も教えてくれなかった。\nそれでも僕は少しだけ分かった気がした。\n${m}。`
  ],
  3:[
    (m,p,b,o)=>`${m}。\nだから僕は、誰かが決めた正解より、\n自分で考えて選んだ間違いを引き受けたい。\nそれが僕の今日を生きるということだ。`,
    (m,p,b,o)=>`${m}。\n僕らは完璧にはなれない。\nでも考えることをやめないことなら選べる。`,
    (m,p,b,o)=>`僕はもう、誰かの正しさだけで自分を決めない。\n${m}。\n明日の選択は明日の僕が決める。`,
    (m,p,b,o)=>`${m}。\nだから間違えることより、考えずに従うことを怖がりたい。`
  ]
};

const bridgeQuestions = [
  "幸せは、失くしてから数えるものなんだろうか。",
  "正しさは、誰かを傷つけても正しいままなんだろうか。",
  "自由は、選べることなのか、選ばないことなのか。",
  "忘れることと、許すことは同じなんだろうか。",
  "大人になるって、疑問を減らすことなんだろうか。",
  "多数派なら間違いは正解になるんだろうか。",
  "誰にも見られていない自分も、本当の自分なんだろうか。",
  "失敗しなかった人生は、本当に成功なんだろうか。",
  "愛することと手放さないことは同じなんだろうか。",
  "未来を守るためなら、今日を犠牲にしてもいいんだろうか。",
  "名前が変わっても、その人は同じ人なんだろうか。",
  "記憶を全部失くしても、僕は僕のままなんだろうか。",
  "優しさに理由が必要なら、それはまだ優しさなんだろうか。",
  "知らないことを認めるのは、弱さなんだろうか。",
  "誰かを許すことは、その人を正しいと認めることなんだろうか。"
];

endings[1].push(
  "結局、何も解決しなかった。それでも僕らは帰ることにした。",
  "朝になったので、僕は歩き出した。理由はそれだけだった。",
  "答えは見つからなかった。ただ、探した時間だけは残った。",
  "僕らは何も言わずに別れた。それで十分な気がした。"
);
endings[2].push(
  "帰り道で気づいた。探していたものは、最初から僕の手の中にあった。",
  "最後に残った一行を読んで、僕はようやく君の沈黙の意味を知った。",
  "なくしたと思っていたものは、形を変えてずっとそばに残っていた。",
  "出口に着いて振り返ると、入口だと思っていた場所が消えていた。"
);
endings[3].push(
  "最後のページを開くと、ここまでの出来事が全部僕自身の筆跡で書かれていた。",
  "出口の鏡に映っていたのは僕ではなく、ずっと一緒に歩いてきた君だった。",
  "時計が動き出した瞬間、僕は気づいた。止まっていたのは世界ではなく記憶だった。",
  "扉の向こうにいたのは未来の僕だった。彼は僕と同じ傷を持っていた。",
  "名前を呼ばれて振り向いた。そこには誰もいなかった。呼んだ声は僕自身だった。"
);

function updateButton(){
  const ready = Object.values(state).every(v => v !== null);
  const btn = document.getElementById("generateBtn");
  btn.disabled = !ready;
  document.getElementById("hint").textContent = ready
    ? "設定完了。生成できます。"
    : "メインテーマと4項目をすべて選ぶと生成できます。";
}

document.querySelectorAll(".theme-btn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".theme-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    state.theme = btn.dataset.theme;
    updateButton();
  });
});

document.querySelectorAll(".setting").forEach(box=>{
  box.querySelectorAll(".level-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{
      box.querySelectorAll(".level-btn").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      state[box.dataset.setting] = Number(btn.dataset.value);
      updateButton();
    });
  });
});

function generateLyrics(){
  if(Object.values(state).some(v=>v===null)) return;
  const b = banks[state.theme];
  const place = R(b.places), being=R(b.beings), obj=R(b.objects), conflict=R(b.conflicts);
  const title = R(b.titles);

  let verse1, verse2;
  if(state.story===1){
    verse1 = R(story1Openings)(place,being,obj,conflict);
    verse2 = R(story1Developments)(place,being,obj,conflict);
  } else if(state.story===2){
    verse1 = R(openings2)(place,being,obj,conflict);
    verse2 = R(story2Developments)(place,being,obj,conflict);
  } else {
    verse1 = R(openings3)(place,being,obj,conflict);
    verse2 = R(story3Developments)(place,being,obj,conflict);
  }

  let chorus = R(chorusPatterns[state.message])(R(b.messages),place,being,obj);

  let bridge = "";
  if(state.theme==="philosophy" || state.message>=2 || Math.random()<0.45){
    bridge += R(bridgeQuestions) + "\n";
  }
  const bridgeClosers = state.story===3 ? [
    "僕らは結局、目的地の手前で立ち止まった。",
    "その先へ進むかどうかを決めるのに、朝までかかった。",
    "最後の角を曲がる前に、僕らは一度だけ振り返った。",
    "目的地は見えていた。でも、そこへ行くことが正解とは限らなかった。",
    "僕らは扉の前まで来て、初めて開けないという選択肢に気づいた。"
  ] : [
    "答えは出ないまま、空だけが少し明るくなった。",
    "結論は出なかった。でも考えることはやめなかった。",
    "誰も正解を教えてくれなかった。それでよかったのかもしれない。",
    "遠くで朝の音がした。僕らはまだ同じ場所にいた。",
    "何かが変わった気はした。でも何が変わったのかは分からなかった。"
  ];
  bridge += R(bridgeClosers);

  const lyrics = `[Verse 1]
${verse1}

[Verse 2]
${verse2}

[Chorus]
${chorus}

[Bridge]
${bridge}

[Last]
${R(endings[state.twist])}`;

  document.getElementById("songTitle").textContent = title;
  document.getElementById("meta").textContent =
    `テーマ：${b.label} ／ 比喩度：${state.metaphor} ／ どんでん返し度：${state.twist} ／ ストーリー度：${state.story} ／ メッセージ度：${state.message}`;
  document.getElementById("lyrics").textContent = lyrics;
  document.getElementById("result").style.display = "block";
  document.getElementById("result").scrollIntoView({behavior:"smooth",block:"start"});
}

document.getElementById("generateBtn").addEventListener("click",generateLyrics);
document.getElementById("regenBtn").addEventListener("click",generateLyrics);

document.getElementById("copyBtn").addEventListener("click",async()=>{
  const t=document.getElementById("songTitle").textContent;
  const l=document.getElementById("lyrics").textContent;
  if(!l) return;
  await navigator.clipboard.writeText(`${t}\n\n${l}`);
});

document.getElementById("resetBtn").addEventListener("click",()=>{
  state.theme=state.metaphor=state.twist=state.story=state.message=null;
  document.querySelectorAll(".active").forEach(el=>el.classList.remove("active"));
  document.getElementById("result").style.display="none";
  updateButton();
});

updateButton();
</script>
</body>
</html>
